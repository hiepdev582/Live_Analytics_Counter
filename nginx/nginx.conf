user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend_cluster {
        # Sử dụng Round Robin mặc định để phân phối tải đều giữa các instance
        server app_backend_1:8080 max_fails=3 fail_timeout=30s;
        server app_backend_2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. HTTP REST API Routing
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Real-time WebSocket Gateway Routing
        location /ws/ {
            proxy_pass http://backend_cluster;
            
            # Upgrade HTTP connection to WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s; # Tránh ngắt kết nối WebSocket
        }

        location /health {
            return 200 'NGINX is healthy';
            add_header Content-Type text/plain;
        }
    }
}